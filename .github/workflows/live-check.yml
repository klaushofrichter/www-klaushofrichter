name: Live check

# The release, checked from outside after it has gone live: the read-only
# part of the e2e suite (tests tagged @live) and Lighthouse, pointed at
# https://www.klaushofrichter.net, and /health must name the release just cut.
#
# deploy-production.yml already smoke-tests with curl from the in-cluster
# runner; this adds what curl cannot see (real browsers on a phone and a
# desktop, every card picture loading, every link followed, accessibility,
# Lighthouse). A browser cannot run on the in-cluster runner (512Mi), so it
# runs here, on GitHub's runners, after each successful deploy and once a day
# so a site that breaks between releases is noticed too.
#
# Read-only and signed out: @live tests only GET, never POST and never sign
# in (the Login link is checked to hand over to Google, and followed no
# further). Adapted from klaushofrichter/christina.art.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  schedule:
    - cron: '41 10 * * *'   # 04:41 Chicago (CST), outside the busy hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    # After a deploy only if it succeeded; a failed deploy cut no release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.klaushofrichter.net
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The newest release is what must be live: after a deploy it is the one
      # that deploy cut (the release step runs last, after the rollout).
      - name: Which release should be live
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "expecting ${tag}"

      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      - name: Walk the live site in four browsers
        env:
          EXPECT_VERSION: ${{ steps.rel.outputs.version }}
        run: npx playwright test --grep @live

      - name: Lighthouse (Google PageSpeed) on the live site
        run: scripts/lighthouse-gate.sh https://www.klaushofrichter.net/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-check-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 30
