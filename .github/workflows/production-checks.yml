name: PR checks

# Both branches, not just production. PRs to main - Dependabot's, in particular
# - previously ran nothing at all: build-push.yml triggers on push, and this
# file only listened for production. Dependency bumps were landing on main
# unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The scanner, tests and e2e code included: nothing else type-checks
      # them before a deploy (vitest and tsx strip types without checking),
      # and the scanner's own build otherwise first runs mid-deploy.
      - run: npm run typecheck

      - run: npm test

      # Dependabot notices a vulnerable dependency, but noticing is not
      # blocking: without this step a package with a known advisory can be
      # merged and deployed while its fix PR sits open. Threshold is `high`
      # rather than the default so that a moderate advisory whose only fix is
      # a major upgrade cannot wedge unrelated merges - the alerts still
      # surface those, they just do not stop the queue.
      - run: npm audit --audit-level=high

  e2e:
    # The release gate, in a browser, on GitHub's runners: installing a
    # browser on the in-cluster self-hosted runner (512Mi) OOM-kills it.
    #
    # It tests the Docker image this commit builds, the same artifact the
    # deploy ships, in four browsers: desktop Chrome, an Android phone, an
    # iPhone (WebKit, i.e. Safari) and desktop Firefox. Then Lighthouse,
    # Google's PageSpeed engine, on a phone profile. One job, so the required
    # check stays the single `e2e` context. This is kube-setup's "public web
    # pages" baseline (docs/cluster-deployment-requirements.md, §4), adapted
    # from klaushofrichter/christina.art.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Shared by the server and the signed-in specs, which sign their own
      # session cookie with it (e2e/session.ts). Not a real secret.
      COOKIE_SECRET: e2e-cookie-secret-not-used-for-anything-real
      GOOGLE_CLIENT_ID: e2e
      GOOGLE_CLIENT_SECRET: e2e
      GOOGLE_REDIRECT_URI: http://localhost:8080/auth/google/callback
      ALLOWED_EMAILS: klaus@klaushofrichter.net
      # The survey specs run against e2e/fakeScanner.ts. CI never scans a
      # real network.
      SCANNER_URL: http://127.0.0.1:9451
      SCANNER_TOKEN: e2e-scanner-token
      FAKE_SCANNER_PORT: '9451'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Host networking, so the server in the container reaches the fake
      # scanner on the runner's 127.0.0.1 exactly as `npm start` did.
      - name: Build and start the image, and the fake scanner
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t www-klaushofrichter:e2e .
          docker run -d --name site --network host -e PORT=8080 \
            -e COOKIE_SECRET -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET \
            -e GOOGLE_REDIRECT_URI -e ALLOWED_EMAILS -e SCANNER_URL -e SCANNER_TOKEN \
            www-klaushofrichter:e2e
          nohup npx tsx e2e/fakeScanner.ts > fake-scanner.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null && curl -sf http://127.0.0.1:9451/health >/dev/null; then
              break
            fi
            echo "waiting for the image and the fake scanner (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8080/health | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs site; exit 1; }
          curl -sf http://127.0.0.1:9451/health >/dev/null \
            || { echo "::error::fake scanner did not come up"; cat fake-scanner.log; exit 1; }

      # `--with-deps` runs `apt-get update`, which also reads the Google
      # Chrome source the runner image ships; one bad index there fails the
      # whole job (it did, 2026-09-09, in art), so drop that source. The Chrome
      # binary itself stays: Lighthouse uses it below.
      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      # failOnFlakyTests (playwright.config.ts) fails this step if any test
      # passed only on its retry.
      - name: Walk the site in four browsers
        env:
          BASE_URL: http://localhost:8080
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test

      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8080/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 14

      - name: Server and fake scanner logs when something failed
        if: failure()
        run: |
          docker logs site || true
          cat fake-scanner.log || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          # Accepted findings live in .github/codeql-accepted.tsv, one per line
          # as ruleId<TAB>path<TAB>reason. They are ignored here and reported as
          # notices; everything else still blocks the merge. Keeping the list in
          # the repo means an exception arrives through a pull request and stays
          # visible, rather than living in the Security UI where a reviewer
          # never sees it.
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          if [ "$blocking" -gt 0 ]; then
            echo "::error::CodeQL found $blocking unaccepted finding(s) — blocking merge"
            exit 1
          fi
