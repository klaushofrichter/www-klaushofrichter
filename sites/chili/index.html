<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chili con carne</title>
  <meta name="description" content="Chili con carne: the recipe and the story behind it. Coming soon.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <style>
    :root { --bg: #fbf6f1; --ink: #2a1a14; --soft: #5e4a40; --accent: #a8321c; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1412; --ink: #f4e9e2; --soft: #cdbab0; --accent: #ef8a6b; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; box-sizing: border-box; }
    main { max-width: 34rem; text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 .4rem; color: var(--accent); letter-spacing: -.01em; }
    p { margin: 0; color: var(--soft); }
  </style>
</head>
<body>
  <main>
